name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Fibrous.sln

      - name: Build
        run: dotnet build Fibrous.sln -c Release --no-restore

      - name: Test
        run: dotnet test Fibrous.sln -c Release --no-build --verbosity normal

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          "package_version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack Fibrous
        run: >
          dotnet pack Fibrous\Fibrous.csproj
          -c Release
          --no-build
          -o artifacts
          -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Pack Fibrous.WPF
        run: >
          dotnet pack Fibrous.WPF\Fibrous.WPF.csproj
          -c Release
          --no-build
          -o artifacts
          -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts\*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
